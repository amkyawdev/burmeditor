name: Auto Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release Name'
        required: false
      prerelease:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      
      - name: Prepare Release Notes
        run: |
          cat > release-notes.md << 'EOF'
          # Release Notes
          
          ## What's New
          
          This release includes:
          - 15 Professional Video Editing Tools
          - Multi-language Support
          - FFmpeg-powered Video Processing
          - Cross-platform Support (Android, iOS, Web)
          
          ## Downloads
          
          Download your preferred build below.
          
          ## Installation
          
          ### Android
          Download the APK and install directly on your device.
          
          ### iOS
          Download and install via Xcode or TestFlight.
          
          ### Web
          Access directly from your browser.
          
          ---
          *Auto-generated by GitHub Actions*
          EOF
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Release ${{ env.VERSION }}"
          generate_release_notes: false
          body_path: release-notes.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}