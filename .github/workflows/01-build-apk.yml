name: Build APK

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/01-build-apk.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  FLUTTER_VERSION: '3.16.9'
  JAVA_VERSION: '17'

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Create Android Platform
        run: |
          cd mobile
          flutter config --enable-android
          flutter create --platforms=android . --no-pub

      - name: Install Dependencies
        run: |
          cd mobile
          flutter clean
          flutter pub get

      - name: Run Tests
        run: |
          cd mobile
          flutter test || true

      - name: Analyze Code
        run: |
          cd mobile
          flutter analyze || true

      - name: Build APK
        run: |
          cd mobile
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release || true
          fi

      - name: Upload APK Artifacts
        run: |
          cd mobile
          cp build/app/outputs/flutter-apk/app-release.apk burme-editor.apk
          cd ..
          ls -la mobile/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: burme-editor.apk
          path: mobile/burme-editor.apk
          retention-days: 30
