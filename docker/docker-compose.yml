version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: burme-editor-backend
    ports:
      - "5000:5000"
    volumes:
      - ../storage:/app/storage
      - ../backend:/app
    environment:
      - FLASK_ENV=development
      - STORAGE_PATH=/app/storage
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - burme-network

  redis:
    image: redis:7-alpine
    container_name: burme-editor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - burme-network

  nginx:
    image: nginx:alpine
    container_name: burme-editor-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - burme-network

volumes:
  redis-data:

networks:
  burme-network:
    driver: bridge