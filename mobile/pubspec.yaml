name: burmese_editor_app
description: Professional Video Editor with 15 Tools - Crop, Audio, Color, Text, Title, Layering, Transform, Speed, Transition, Effects, Masking, Stabilize, Image Overlay, Subtitles, Export
version: 1.0.0+101
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # State Management
  provider: ^6.0.5
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Video Processing
  video_player: ^2.8.0
  file_picker: ^6.1.1
  image_picker: ^1.0.4
  
  # Network
  http: ^1.1.0
  dio: ^5.3.3
  connectivity_plus: ^5.0.2
  
  # Permissions
  permission_handler: ^11.0.1
  
  # Utilities
  device_info_plus: ^9.1.0
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.0
  intl: ^0.18.1
  path: ^1.8.3
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # Background Service
  workmanager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/translations/
  
  # Note: fonts/icons/presets folders need to be created and populated
  # if they are needed. Currently only translations/ is populated.